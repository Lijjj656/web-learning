<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学习任务 Todo List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="todo-app">
      <header class="app-header">
        <p class="eyebrow">JAVASCRIPT PRACTICE</p>
        <h1>我的学习任务</h1>
        <p>把今天要完成的事情写下来，完成后点击任务即可标记。</p>
      </header>

      <section class="todo-panel" aria-labelledby="todo-title">
        <h2 id="todo-title">任务清单</h2>
        <form id="todo-form">
          <label class="sr-only" for="todo-input">新任务</label>
          <input id="todo-input" type="text" placeholder="例如：复习 HTML 表单" autocomplete="off" />
          <button type="submit">添加任务</button>
        </form>
        <div class="toolbar">
          <span id="task-count">0 项任务</span>
          <button id="clear-completed" class="text-button" type="button">清除已完成</button>
        </div>
        <ul id="todo-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">还没有任务，添加第一项学习计划吧。</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
