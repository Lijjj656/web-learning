<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 学习空间</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="brand-panel" aria-labelledby="brand-title">
        <p class="eyebrow">LEARNING SPACE</p>
        <h1 id="brand-title">把学习计划<br />变成行动</h1>
        <p class="brand-description">
          这是一个用于练习 CSS 布局、间距、颜色和响应式设计的登录页面。
        </p>
        <ul class="feature-list">
          <li>记录每日学习任务</li>
          <li>管理项目和学习进度</li>
          <li>为 AI Web 应用打下基础</li>
        </ul>
      </section>

      <section class="form-panel" aria-labelledby="login-title">
        <div class="form-content">
          <p class="welcome">欢迎回来</p>
          <h2 id="login-title">登录你的学习空间</h2>
          <p class="hint">使用邮箱和密码继续。</p>

          <form action="#" method="post">
            <div class="field">
              <label for="email">邮箱</label>
              <input id="email" name="email" type="email" placeholder="name@example.com" required />
            </div>
            <div class="field">
              <div class="field-heading">
                <label for="password">密码</label>
                <a href="#">忘记密码？</a>
              </div>
              <input id="password" name="password" type="password" placeholder="请输入密码" required />
            </div>
            <label class="checkbox-field" for="remember">
              <input id="remember" name="remember" type="checkbox" />
              记住我
            </label>
            <button type="submit">登录</button>
          </form>

          <p class="register-link">还没有账号？<a href="#">创建账号</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
